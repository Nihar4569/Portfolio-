<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#060a0e" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply a refresh before the router mounts and the browser restores scroll.
      if (performance.getEntriesByType?.('navigation')[0]?.type === 'reload') {
        const previousRestoration = history.scrollRestoration;
        history.scrollRestoration = 'manual';
        if (location.pathname !== '/' || location.search || location.hash) {
          history.replaceState(history.state, '', '/');
        }
        window.addEventListener('pageshow', () => {
          requestAnimationFrame(() => { history.scrollRestoration = previousRestoration; });
        }, { once: true });
      }

      let scheme = 'dark';
      try {
        if (localStorage.getItem('theme') === 'light') scheme = 'light';
      } catch {}
      document.documentElement.dataset.theme = scheme;
      document.querySelector('meta[name="color-scheme"]').content = scheme;
      if (scheme === 'light') document.querySelector('meta[name="theme-color"]').content = '#f2f7fb';
    </script>
    <meta name="description" content="Nihar Ranjan Sahu, Software Engineer at Cisco. Explore his work in AI automation, backend systems, and search, or ask Scout about a project." />
